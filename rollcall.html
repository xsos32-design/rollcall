function parse(raw){let mark="",b=raw;
  let p=b.match(/^(課|月會|視訊|基礎)/); if(p){mark+=p[1];b=b.slice(p[1].length);}
  let s=b.match(/(課|月會|視訊|基礎)$/); if(s){mark+=s[1];b=b.slice(0,-s[1].length);}
  return {base:b,mark};}
function tmap(TR,d){const m={};(TR[d]||[]).forEach(t=>t[1].split("、").forEach(n=>m[n]=t[0]));return m;}
function cls(c){if(c[0]==="外")return"cX";if(c[0]==="T")return"cT";if(c[0]==="B")return"cB";if(c[0]==="4")return"c4";if(c[0]==="L")return"cL";if(c[0]==="K")return"cX";return"";}
function group(R,CODES,d,tm){const map={};CODES.forEach(c=>map[c]=[]);const other={};
  R.forEach(p=>{let raw=(p[2].split(",")[d-1]||"").trim();
    if(!raw||raw==="休"){return;}
    raw=raw.replace(/基礎/g,"");
    const {base,mark}=parse(raw);const ann=mark||tm[p[1]]||"";
    const it={name:p[1],grp:p[0],ann};
    if(CODES.includes(base))map[base].push(it); else (other[base]=other[base]||[]).push(p[1]);});
  return {map,other};}
function reportText(R,CODES,d,tm){const g=group(R,CODES,d,tm);const lines=[`${MONTH}/${d}${R===R1?"一組":"二組"}點名`,""];
  CODES.forEach(c=>{if(c==="K8"&&!g.map[c].length)return;
    const nm=g.map[c].map(x=>x.name+(x.ann?`（${x.ann}）`:"")).join("、");lines.push(`${c}：${nm||"🈚️"}`);});
  return lines.join("\n");}
function renderCol(R,CODES,d,tm,el){const g=group(R,CODES,d,tm);let h="";
  CODES.forEach(c=>{const L=g.map[c]; if(c==="K8"&&!L.length)return;
    const nm=L.length?L.map(x=>`${x.name}${x.ann?`<span class=mk>（${x.ann}）</span>`:""}`).join("、"):`<span class=none>🈚️</span>`;
    h+=`<div class=line><b class="${cls(c)}">${c}</b> ${nm}</div>`;});
  const ok=Object.keys(g.other).sort();
  if(ok.length){h+=`<div class=oh>其他</div>`;ok.forEach(c=>{h+=`<div class=o>${c}：${g.other[c].join("、")}</div>`;});}
  el.innerHTML=h;}

const datesEl=document.getElementById("dates");
WD.forEach(w=>{const e=document.createElement("div");e.className="wk"+(w==="六"?" sat":w==="日"?" sun":"");e.textContent=w;datesEl.appendChild(e);});
for(let d=1;d<=NDAYS;d++){const c=document.createElement("div");const w=wd(d);
  c.className="d"+(w==="六"?" sat":w==="日"?" sun":"");
  c.innerHTML=`<span class=num>${d}</span><span class=wd>${w}</span>`;

let curD=null;
function sel(d,c){document.querySelectorAll(".d.active").forEach(e=>e.classList.remove("active"));c.classList.add("active");curD=d;
  document.getElementById("title").textContent=`${YM} ${d}日（${wd(d)}）`;
  renderCol(R1,CODES1,d,tmap(TRAIN1,d),document.getElementById("c1"));
  renderCol(R2,CODES2,d,tmap(TRAIN2,d),document.getElementById("c2"));}
function copyG(g){if(!curD){return;}
  const txt=g===1?reportText(R1,CODES1,curD,tmap(TRAIN1,curD)):reportText(R2,CODES2,curD,tmap(TRAIN2,curD));
  const ta=document.getElementById("report");ta.value=txt;ta.style.left="0";ta.focus();ta.select();ta.setSelectionRange(0,99999);
  try{document.execCommand("copy")}catch(e){} if(navigator.clipboard)navigator.clipboard.writeText(txt).catch(()=>{});
  ta.blur();ta.style.left="-9999px";
  const b=document.querySelectorAll(".cp")[g-1];const o=b.textContent;b.textContent="已複製 ✓";setTimeout(()=>b.textContent=o,1500);}
