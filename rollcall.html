<style>
  :root{
    --bg:#0f131a;--surf:#161c26;--line:#28313e;--faint:#1f2732;
    --tx:#e8edf3;--mut:#8b95a4;--dim:#5a6577;
    --amber:#e6ab4d;--sat:#68a6ff;--sun:#ff8080;--sel:#2d6cf0;--ok:#2f9e5e;
    --cT:#63c1e6;--cB:#74d3a0;--c4:#b69be8;--cL:#e3aa63;--cX:#ec8b7e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;
    font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;padding:14px 10px 48px}
  header{text-align:center;margin-bottom:12px}
  .credit{text-align:center;padding:12px 10px;margin-bottom:12px;border:1.5px solid var(--cX);box-shadow:0 0 26px rgba(236,139,126,.14);
    border-radius:12px;background:linear-gradient(180deg,#20272f,#171d26)}
  .cname{font-size:25px;font-weight:800;letter-spacing:2px;background:linear-gradient(95deg,#8fd4ef,#8ee6ad 55%,#f0c07a);-webkit-background-clip:text;background-clip:text;color:transparent}
  .cwarn{font-size:13px;font-weight:700;color:var(--cX);margin-top:5px;letter-spacing:.3px}
  h1{font-size:17px;font-weight:700;letter-spacing:.5px;margin:0}
  .sub{color:var(--mut);font-size:12px;margin-top:3px}
  .dates{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px}
  .wk{text-align:center;font-size:11px;color:var(--dim);padding-bottom:2px}
  .wk.sat{color:var(--sat)}.wk.sun{color:var(--sun)}
  .d{background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:6px 0 5px;
    cursor:pointer;display:flex;flex-direction:column;align-items:center;transition:background .12s,border-color .12s}
  .d .num{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  .d .wd{font-size:9px;color:var(--dim);margin-top:1px}
  .d .hol{font-size:8.5px;color:var(--amber);font-weight:700;margin-top:2px;line-height:1}
  .d.sat .wd{color:var(--sat)}.d.sun .wd{color:var(--sun)}
  .d.hd{border-color:rgba(255,107,107,.45);background:linear-gradient(180deg,rgba(255,107,107,.10),rgba(255,107,107,0) 62%)}
  .d.hd .num,.d.hd .wd,.d.hd .hol{color:#ff6b6b}
  .d.active{background:linear-gradient(160deg,#3b7bf6,#2158d8);border-color:#4f86f0;box-shadow:0 6px 18px rgba(45,108,240,.42)}
  .d.active .num,.d.active .wd{color:#fff}.d.active .hol{color:#ffe0a3}
  .d.today:not(.active){box-shadow:inset 0 0 0 2px var(--sel)}
  .d .today-t{font-size:8.5px;color:#7fb0ff;font-weight:700;line-height:1;margin-top:2px}
  .d.active .today-t{color:#fff}
  .head{text-align:center;margin:2px 0 12px}
  .head .big{font-size:21px;font-weight:800;background:linear-gradient(90deg,#eaf1f8,#bcd6ea);-webkit-background-clip:text;background-clip:text;color:transparent}
  .head .big small{font-size:13px;font-weight:500;color:var(--mut);margin-left:6px}
  .head .chip{display:inline-block;margin-left:8px;font-size:11px;font-weight:800;color:#fff;box-shadow:0 3px 10px rgba(224,82,82,.35);
    background:linear-gradient(135deg,#ef5f5f,#d23c3c);border-radius:6px;padding:2px 8px;vertical-align:middle}
  .head.empty{color:var(--mut);font-size:14px;font-weight:400}
  .btns{display:flex;gap:8px;margin-bottom:14px}
  .cp{flex:1;padding:12px 8px;font-size:14px;font-weight:700;color:#fff;border:none;border-radius:12px;cursor:pointer;letter-spacing:.4px;
    background:linear-gradient(135deg,#2fae66,#22a596);box-shadow:0 6px 16px rgba(38,160,120,.30)}
  .cp:active{filter:brightness(1.1);transform:translateY(1px)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grp{border:1px solid var(--line);border-radius:14px;padding:10px 10px 6px;box-shadow:0 3px 16px rgba(0,0,0,.28)}
  .g1{background:linear-gradient(180deg,rgba(99,193,230,.07),rgba(99,193,230,0) 55%)}
  .g2{background:linear-gradient(180deg,rgba(116,211,160,.07),rgba(116,211,160,0) 55%)}
  .grph{font-size:14px;font-weight:800;padding-bottom:6px;margin-bottom:5px;border-bottom:2px solid var(--line);letter-spacing:.5px}
  .g1 .grph{border-color:var(--cT)}.g2 .grph{border-color:var(--cB)}
  .row{display:flex;align-items:flex-start;gap:8px;padding:5px 1px;font-size:12.5px;line-height:1.5;border-bottom:1px solid var(--faint)}
  .code{flex:0 0 auto;min-width:42px;text-align:center;font-weight:800;font-size:11.5px;padding:2px 6px;border-radius:7px;font-variant-numeric:tabular-nums;letter-spacing:.3px}
  .who{flex:1;min-width:0}
  .nm{cursor:pointer;border-radius:4px;padding:0 1px}
  .nm.on{color:#a6ecc2;font-weight:700;background:rgba(79,208,138,.13);border-radius:6px;padding:1px 5px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .chk{color:#4fd08a}
  .ic{width:15px;height:15px;vertical-align:-3px;flex:none;display:inline-block}
  h1 .ic{width:17px;height:17px;vertical-align:-3px;margin-right:6px;color:var(--mut)}
  .cp .ic{width:16px;height:16px;margin-right:6px}
  .cwarn .ic{width:13px;height:13px;vertical-align:-2px;margin-right:5px}
  svg.chk{width:14px;height:14px;vertical-align:-2px;color:#4fd08a}
  .mk .ic{width:11px;height:11px;vertical-align:-1px;margin-right:2px}
  .sub-h .ic{width:12px;height:12px;vertical-align:-2px;margin-right:4px}
  body::after{content:"";position:fixed;bottom:-120px;left:50%;transform:translateX(-50%);
    width:520px;height:320px;pointer-events:none;z-index:0;
    background:radial-gradient(60% 60% at 50% 100%,rgba(116,211,160,.07),transparent 70%)}
  body::before{content:"";position:fixed;top:-90px;left:50%;transform:translateX(-50%);
    width:460px;height:300px;pointer-events:none;z-index:0;
    background:radial-gradient(60% 60% at 50% 0,rgba(99,193,230,.12),rgba(116,211,160,.05) 45%,transparent 72%)}
  .credit,header,.dates,.head,#emptyArt,#panel{position:relative;z-index:1}
  header{padding-bottom:10px}
  header::after{content:"";display:block;height:1px;margin:11px auto 0;width:66%;
    background:linear-gradient(90deg,transparent,rgba(99,193,230,.55),rgba(116,211,160,.55),transparent)}
  #emptyArt{text-align:center;padding:26px 12px 10px;animation:fade .5s ease}
  #emptyArt svg{width:220px;height:auto;max-width:82%}
  #emptyArt .cap{margin-top:14px;font-size:13.5px;color:var(--mut);letter-spacing:.5px}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
  #emptyArt circle{animation:tw 3.2s ease-in-out infinite}
  #emptyArt circle:nth-of-type(2){animation-delay:.7s}#emptyArt circle:nth-of-type(3){animation-delay:1.3s}#emptyArt circle:nth-of-type(4){animation-delay:.4s}#emptyArt circle:nth-of-type(5){animation-delay:1.9s}
  .hint{text-align:center;color:var(--dim);font-size:11px;margin:-6px 0 8px}
  .clrwrap{text-align:center;margin-bottom:13px}
  .clr{background:none;border:1px solid var(--line);color:var(--mut);font-size:12px;padding:6px 16px;border-radius:8px;cursor:pointer}
  .clr:active{background:var(--surf)}
  .none{color:var(--dim)}
  .mk{color:var(--amber);font-size:11px}
  .sub-h{font-size:11px;color:var(--dim);margin:8px 0 3px;font-weight:600}
  .orow{font-size:12px;color:var(--mut);line-height:1.5;padding:1px 0}
  .cT{color:#93d6f0;background:rgba(99,193,230,.13)}.cB{color:#93e4b6;background:rgba(116,211,160,.13)}.c4{color:#c9b4f0;background:rgba(182,155,232,.14)}.cL{color:#ecc082;background:rgba(227,170,99,.14)}.cX{color:#f2a99e;background:rgba(236,139,126,.14)}
  #report{position:absolute;left:-9999px}

  .g1 .grph{color:var(--t40)!important;border-color:var(--t40)!important;text-shadow:0 0 10px rgba(46,230,200,.5)}
  .g2 .grph{color:var(--t53)!important;border-color:var(--t53)!important;text-shadow:0 0 10px rgba(255,45,110,.5)}

function parse(raw,gnum){let mark="",b=raw;
  let pj=b.match(/^(進階)/); if(pj){mark+="進階";b=b.slice(2);}
  let p=b.match(/^(課|月會|視訊|基礎)/); if(p){mark+=(mark?"・":"")+p[1];b=b.slice(p[1].length);}
  let s=b.match(/(課|月會|視訊|基礎)$/); if(s){mark+=(mark?"・":"")+s[1];b=b.slice(0,-s[1].length);}
  let md=b.match(/^([1-8])$/); if(md){b=(gnum===1?"B":"T")+md[1];mark="跑"+md[1]+(mark?"・"+mark:"");}
  return {base:b,mark};}
function tmap(TR,d){const m={};(TR[d]||[]).forEach(t=>t[1].split("、").forEach(n=>m[n]=t[0]));return m;}

function ckKey(d,g,n){return d+"::"+g+"::"+n;}
function saveCK(){try{localStorage.setItem("ck"+YEAR+"_"+MONTH,JSON.stringify(CK))}catch(e){}}
function toggle(d,g,n){const k=ckKey(d,g,n);if(CK[k])delete CK[k];else CK[k]=1;saveCK();rerender();}
function clearDay(){if(!curD)return;Object.keys(CK).forEach(k=>{if(k.indexOf(curD+"::")===0)delete CK[k]});saveCK();rerender();}

function group(R,CODES,d,tm,gnum){const map={};CODES.forEach(c=>map[c]=[]);const other={};
  R.forEach(p=>{let raw=(p[2].split(",")[d-1]||"").trim();
    if(!raw||raw==="休"){return;}
    const {base,mark}=parse(raw,gnum);const ann=mark?mark:(tm[p[1]]?"上課"+tm[p[1]]:"");
    const it={name:p[1],grp:p[0],ann};
    if(CODES.includes(base))map[base].push(it); else (other[base]=other[base]||[]).push(p[1]);});
  return {map,other};}
function reportText(R,CODES,d,tm,gnum){const g=group(R,CODES,d,tm,gnum);const lines=[`${MONTH}/${d}${R===R1?"一組":"二組"}點名`,""];
  CODES.forEach(c=>{if(c==="K8"&&!g.map[c].length)return;
    const nm=g.map[c].map(x=>x.name+(x.ann?`（${x.ann}）`:"")+(CK[ckKey(d,gnum,x.name)]?"✅":"")).join("、");lines.push(`${c}：${nm||"🈚️"}`);});
  return lines.join("\n");}

function renderCol(R,CODES,d,tm,el,gnum){const g=group(R,CODES,d,tm,gnum);let h="";
  CODES.forEach(c=>{const L=g.map[c]; if(c==="K8"&&!L.length)return;
    const nm=L.length?L.map(x=>{const on=!!CK[ckKey(d,gnum,x.name)];

    h+=`<div class=row><span class="code ${cls(c)}">${c}</span><span class=who>${nm}</span></div>`;});
  const ok=Object.keys(g.other).sort();
  if(ok.length){h+=`<div class=sub-h><svg class="ic " viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>休假・其他</div>`;ok.forEach(c=>{h+=`<div class=orow>${c}：${g.other[c].join("、")}</div>`;});}
